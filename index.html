<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planner Esami</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2563eb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fc;--fg:#14203a;--card:#fff;--ac:#2563eb;--ac2:#06b6d4;--or:#f59e0b;--mut:#64748b;--bd:#e2e9f5}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#e8eefb;--card:#131c2e;--ac:#60a5fa;--ac2:#22d3ee;--or:#fbbf24;--mut:#8fa0bd;--bd:#243049}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;padding:20px 20px 26px;border-radius:0 0 28px 28px;font-weight:700;font-size:20px;box-shadow:0 8px 24px rgba(37,99,235,.22)}
main{max-width:760px;margin:0 auto;padding:8px 14px 150px}
nav{position:fixed;bottom:10px;left:12px;right:12px;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-radius:26px;box-shadow:0 8px 28px rgba(20,32,58,.18);z-index:5;padding:4px}
nav button{flex:1;border:0;border-radius:22px;background:none;padding:8px 4px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}nav button b{font-size:21px}nav button.on{color:var(--ac);background:var(--bg);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 13px}
button{cursor:pointer;font-weight:600;border-radius:999px}button:disabled{cursor:default}
button.pri{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border:0}
input{min-width:0}input.n{width:72px;text-align:center}input[type=range]{flex:1;min-width:120px;padding:0;accent-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.row input:not(.n):not([type=range]):not([type=checkbox]){flex:1}
.card{background:var(--card);border-radius:22px;padding:18px;margin:18px 0;box-shadow:0 4px 18px rgba(20,32,58,.07)}
.sub{border-top:1px dashed var(--bd);margin-top:20px;padding-top:16px}.sec{background:var(--bg);border-radius:16px;padding:14px;margin:12px 0}
.item{background:var(--bg);border-radius:16px;padding:14px;margin:12px 0}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i,.cp .seg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .4s}
small{color:var(--mut)}h2{margin:.8em 0 .2em}
.ring{--p:0;flex:none;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}
.ring span{width:45px;height:45px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700}
.cps{display:flex;gap:5px;margin:14px 0 6px}.cp{flex:1;min-width:0}.cp .seg{height:11px;border-radius:6px;background:var(--bd);overflow:hidden}.cp.oral .seg i{background:var(--or)}
.cp .fl{font-size:11px;color:var(--mut);text-align:center;margin-top:4px;white-space:nowrap}
.next{background:var(--bg);border-radius:14px;padding:10px 14px;margin:10px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 13px;font-size:13px}
.chip.ok{background:var(--ac);color:#fff;border-color:var(--ac)}.chip.now{border:2px solid var(--ac);color:var(--ac)}.chip.lock{color:var(--mut);opacity:.6}
.chip.oral{border-style:dashed;border-color:var(--or)}.chip.oral.ok{background:var(--or);color:#fff}.chip.oral.now{color:var(--or);border:2px dashed var(--or)}
.chip em{font-style:normal;font-size:11px;opacity:.8}.tag{font-size:12px;font-weight:600;color:var(--ac)}.tag.oral{color:var(--or)}
.pb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:8px}
dialog{max-width:640px;width:94vw;border:0;border-radius:22px;padding:20px;background:var(--bg);color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.3)}
textarea{width:100%}.tbl{max-height:34vh;overflow:auto}details summary{cursor:pointer;color:var(--mut);margin:8px 0}
.ob{width:100%;margin-top:12px;padding:13px;background:var(--bg);color:var(--ac);font-size:15px}.panel{background:var(--card);border-radius:14px;padding:10px 14px;margin:10px 0}.hint{background:var(--bg);border-left:4px solid var(--ac);border-radius:14px;padding:12px 14px;margin:12px 0}
.chev{width:44px;height:44px;padding:0;border-radius:50%;font-size:16px;color:var(--ac);background:var(--bg);flex:none}.chev.sm{width:38px;height:38px;font-size:14px}.link{background:none;border:0;color:var(--ac);padding:4px 0}.ub{position:fixed;bottom:86px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:6}.ub button{box-shadow:0 4px 14px rgba(20,32,58,.2)}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script type="module">
// ===== CONFIGURAZIONE FIREBASE: incolla qui l'oggetto firebaseConfig. Se resta null l'app funziona solo in locale. =====
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDhlsiW65Nc9fHK1nbuT_XO3J2bKLdmYVc",
    authDomain: "planner-esami.firebaseapp.com",
    projectId: "planner-esami",
    storageBucket: "planner-esami.firebasestorage.app",
    messagingSenderId: "622617303088",
    appId: "1:622617303088:web:0be54f941f8244440335f5"
  };
// ========================================================================================================================
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),D=s=>new Date(s+'T12:00:00');
const DEF={reads:2,reps:2,oral:true,rest:[0],margin:2,gap:1,block:20};
let S=JSON.parse(localStorage.getItem('pe')||'null')||{exams:[]},tab='oggi',open={},user=null,api=null,ch=null,eb=null,hist=[],fut=[],cur='',hide=false,unsub,tm;
const init=()=>{S.set={...DEF,...S.set};S.exams.forEach(e=>e.books.forEach(b=>b.secs.forEach(s=>{if(!s.p)s.p=Array.from({length:s.n||0},()=>s.b);delete s.n})))};init();cur=JSON.stringify(S);
// ===== modello: s.p[i] = ultima pagina raggiunta nel passaggio i (0..R-1 letture, poi ripetizioni orali) =====
const pg=s=>Math.max(1,s.b-s.a+1),dn=(s,i)=>Math.min(pg(s),Math.max(0,(s.p[i]??s.a-1)-s.a+1));
const NR=(s,b)=>s.reads??b.reads??S.set.reads,NP=(s,b)=>s.reps??b.reps??(S.set.oral?S.set.reps:0),TT=(s,b)=>NR(s,b)+NP(s,b);
const sd=(s,b)=>{let x=0;for(let i=0;i<TT(s,b);i++)x+=dn(s,i);return x};
const frac=(s,b)=>{const t=TT(s,b);return t?sd(s,b)/pg(s)/t:0};
const act=(s,b)=>{const t=TT(s,b);for(let i=0;i<t;i++)if(dn(s,i)<pg(s))return i;return -1};
const prog=l=>{let w=0,p=0;l.forEach(([s,b])=>{w+=pg(s);p+=pg(s)*frac(s,b)});return w?p/w:0};
const allSecs=e=>e.books.flatMap(b=>b.secs.map(s=>[s,b]));
const pl=(i,R,P)=>i==0?'Lettura':i<R?(R>2?`Rilettura ${i}`:'Rilettura'):`Ripetizione orale${P>1?' '+(i-R+1):''}`;
const ring=p=>`<div class=ring style="--p:${Math.round(p*100)}"><span>${Math.round(p*100)}%</span></div>`;
const bar=p=>`<div class=bar><i style="width:${Math.round(p*100)}%"></i></div>`;
const F=d=>{const e=S.exams.find(x=>x.id==d.e),b=e?.books.find(x=>x.id==d.b),s=b?.secs.find(x=>x.id==d.s);return{e,b,s}};
const touch=(s,b)=>{if(s.day?.d!==today())s.day={d:today(),v:sd(s,b)}};
function persist(){localStorage.setItem('pe',cur);clearTimeout(tm);if(api?.push&&user)tm=setTimeout(()=>api.push(S),500)}
function save(){const n=JSON.stringify(S);if(n!==cur){hist.push(cur);if(hist.length>30)hist.shift();fut=[];cur=n;hide=false}persist();render()}
const histGo=(from,to)=>{if(!from.length)return;to.push(cur);cur=from.pop();S=JSON.parse(cur);ch=eb=null;dlg();persist();render()};
const histUndo=()=>histGo(hist,fut),histRedo=()=>histGo(fut,hist);
const coarse=()=>matchMedia('(pointer:coarse)').matches;
function undoBar(){const al=localStorage.getItem('peua');if(!coarse()||!(al||((hist.length||fut.length)&&!hide)))return '';
 return `<div class=ub><button data-a=uundo ${hist.length?'':'disabled'}>↶ Annulla</button><button data-a=uredo ${fut.length?'':'disabled'}>↷ Ripeti</button>${al?'':'<button class=pri data-a=uhide>Fatto</button>'}</div>`}
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.target.matches?.('input,textarea,select'))return;const k=e.key.toLowerCase();
 if(k=='z'&&!e.shiftKey){e.preventDefault();histUndo()}else if(k=='y'||(k=='z'&&e.shiftKey)){e.preventDefault();histRedo()}});
const errIt=e=>({'auth/invalid-credential':'Email o password non corretta.','auth/wrong-password':'Password non corretta.','auth/user-not-found':'Nessun account con questa email: se è la prima volta, tocca Registrati.','auth/invalid-email':'L\'indirizzo email non è valido.','auth/email-already-in-use':'Questa email è già registrata: tocca Accedi.','auth/weak-password':'La password è troppo corta: servono almeno 6 caratteri.','auth/missing-password':'Inserisci la password.','auth/missing-email':'Inserisci l\'email.','auth/too-many-requests':'Troppi tentativi: attendi qualche minuto e riprova.','auth/network-request-failed':'Problema di connessione: controlla la rete.','auth/user-disabled':'Questo account è stato disattivato.'}[e.code]||'Qualcosa è andato storto, riprova.');
const studyDays=end=>{let c=0;const d=D(today()),e=D(end);for(;d<=e;d.setDate(d.getDate()+1))if(!S.set.rest.includes(d.getDay()))c++;return Math.max(c,1)};

const dl=(e,x)=>e.dl?.[x.key]||'',dfmt=d=>D(d).toLocaleDateString('it-IT',{day:'numeric',month:'short'}),dleft=d=>Math.round((D(d)-D(today()))/864e5);
const dtxt=(e,x)=>{const d=dl(e,x);if(!d)return '';if(x.p>=1)return ' · ✓ raggiunto';const n=dleft(d);return n<0?` · ⚠ entro il ${dfmt(d)}: in ritardo di ${-n} giorni`:` · entro il ${dfmt(d)} (${n==0?'oggi':'tra '+n+' giorni'})`};
const modeChoice=(e,late)=>`<div class=next><small>Come vuoi organizzare lo studio?</small><div class=row><button class="${e.mode=='cp'?'pri':''}" style="flex:1" data-a=mode data-v=cp data-e=${e.id}>🎯 Calibra sul prossimo traguardo</button><button class="${e.mode=='cp'?'':'pri'}" style="flex:1" data-a=mode data-v=all data-e=${e.id}>⚖️ Dividi il lavoro fino all'esame</button></div>${e.mode=='cp'&&late?'<small>⚠ La scadenza del prossimo traguardo è già passata: sposta la data nella scheda Esami per calibrare su di essa. Per ora il lavoro è diviso fino all\'esame.</small>':''}</div>`;
function dlPanel(e){const c=cps(allSecs(e));if(!c.length)return '';
 return `<div class=sub><b>📅 Scadenze dei traguardi</b> <small>(facoltative)</small>${c.map(x=>`<div class=row><span style=flex:1>${x.o?'🗣 ':''}${x.k+1}. ${x.l}${x.p>=1?' ✓':''}</span><input type=date style="flex:0 0 auto" value="${e.dl?.[x.key]||''}" data-c=dl data-e=${e.id} data-k=${x.key}></div>`).join('')}</div>`}
function cps(as){const T=Math.max(0,...as.map(([s,b])=>TT(s,b))),r=[];
 for(let k=0;k<T;k++){const bk=new Map();let lab='',key='',o=true;
  as.forEach(([s,b])=>{if(TT(s,b)>k){const x=bk.get(b)||{w:0,d:0};x.w+=pg(s);x.d+=dn(s,k);bk.set(b,x);if(!lab){lab=pl(k,NR(s,b),NP(s,b));key=k<NR(s,b)?'r'+k:'o'+(k-NR(s,b))}if(k<NR(s,b))o=false}});
  let w=0,d=0;bk.forEach(x=>{w+=x.w;d+=x.d});
  r.push({k,key,l:lab,o,p:w?d/w:0,miss:[...bk].filter(([b,x])=>x.d<x.w).map(([b,x])=>`${b.title} ${Math.round(x.d/x.w*100)}%`)})}
 return r}
function cpHTML(as,e){const c=cps(as);if(!c.length)return '';const nx=c.find(x=>x.p<1),pc=x=>Math.round(x.p*100);
 return `<div class=cps>${c.map(x=>`<div class="cp ${x.o?'oral':''}"><div class=seg><i style="width:${pc(x)}%"></i></div><div class=fl>${x.p>=1?'🚩':x.k+1}${x.p<1&&x.p>0?' · '+pc(x)+'%':''}</div></div>`).join('')}</div>`
 +(nx?`<div class=next><b>Prossimo traguardo: ${nx.o?'🗣 ':''}${nx.l}</b> <small>${pc(nx)}%${nx.miss.length?' · mancano: '+nx.miss.map(esc).join(', '):''}${dtxt(e,nx)}</small></div>`+c.filter(x=>x!==nx&&x.p<1&&(x.p>0||dl(e,x))).map(x=>`<div><small>${x.o?'🗣 ':''}${x.l}: ${x.p>0?pc(x)+'% già avviata':'non ancora iniziata'}${dtxt(e,x)}</small></div>`).join(''):'<div class=next><b>🎉 Tutti i traguardi raggiunti</b></div>')}
function vOggi(){const t=today(),ex=S.exams.filter(e=>e.date>=t).sort((a,b)=>a.date<b.date?-1:1),g=prog(S.exams.flatMap(allSecs));
 let h=`<div class=card><div class=row>${ring(g)}<div><b>Progresso generale</b><br><small>Letture, riletture e ripetizioni orali di tutti gli esami</small></div></div></div>`;
 if(!ex.length)return h+'<p>Aggiungi un esame nella scheda Esami.</p>';
 for(const e of ex){const as=allSecs(e),end=iso(new Date(D(e.date).getTime()-S.set.margin*864e5)),days=studyDays(end<t?t:end),left=Math.round((D(e.date)-D(t))/864e5);
  const rem=as.reduce((x,[s,b])=>x+pg(s)*TT(s,b)*(1-frac(s,b)),0),dt=as.reduce((x,[s,b])=>x+(s.day?.d===t?Math.max(0,sd(s,b)-s.day.v):0),0);
  const cc=cps(as),tg=cc.find(x=>dl(e,x)&&x.p<1),useCp=e.mode=='cp'&&tg&&dl(e,tg)>=t,late=!!tg&&dl(e,tg)<t;
  let remK=0;if(useCp)as.forEach(([s,b])=>{if(TT(s,b)>tg.k){remK+=pg(s)*(tg.k+1);for(let i=0;i<=tg.k;i++)remK-=dn(s,i)}});
  const target=useCp?Math.ceil((remK+dt)/studyDays(dl(e,tg))):Math.ceil((rem+dt)/days);let need=target-dt;
  const cand=as.filter(([s,b])=>{const a=act(s,b);return a>=0&&(!useCp||a<=tg.k)&&(a<NR(s,b)||s.day?.d===t||!s.last||(D(t)-D(s.last))/864e5>=S.set.gap)}).sort((x,y)=>act(...x)-act(...y));
  const items=[];for(const[s,b]of cand){if(need<=0)break;const a=act(s,b),st=s.a+dn(s,a),tk=Math.min(s.b-st+1,need);items.push({s,b,a,st,en:st+tk-1});need-=tk}
  h+=`<div class=card><div class=row>${ring(prog(as))}<div><b>${esc(e.name)}</b><br><small>tra ${left} giorni · oggi circa ${target} pagine${useCp?' per «'+tg.l+'»':''}${end<t?' · margine di sicurezza superato':''}</small></div></div>${cpHTML(as,e)}${tg?modeChoice(e,late):''}`
   +items.map(({s,b,a,st,en})=>{const R=NR(s,b),P=NP(s,b),ids=`data-e=${e.id} data-b=${b.id} data-s=${s.id}`;
    return `<div class=item><div class=row><b style=flex:1>${esc(s.t)}</b><small>${esc(b.title)}</small></div><div class=row><span class="tag ${a>=R?'oral':''}">${a>=R?'🗣 ':''}${pl(a,R,P)}${a>=R?' (facoltativa)':''}</span><span style=flex:1>pag. ${st}–${en}</span><button class=pri data-a=upto data-i=${a} data-v=${en} ${ids}>✓ Fatto fino a ${en}</button></div></div>`}).join('')
   +(!items.length?`<p><small>${dt>0&&need<=0?'🎉 Obiettivo di oggi raggiunto!':'Niente da fare oggi (ripetizioni in attesa di distanziamento, oppure tutto completato).'}</small></p>`:need<=0&&dt>0?'':'')+'</div>'}
 return h}

function secHTML(e,b,s){const R=NR(s,b),P=NP(s,b),T=R+P,a=act(s,b),ids=`data-e=${e.id} data-b=${b.id} data-s=${s.id}`;
 let h=`<div class=sec><div class=row><b style=flex:1>${esc(s.t)} <small>p.${s.a}–${s.b}</small></b><small>${Math.round(frac(s,b)*100)}%</small><button data-a=sopt ${ids}>⚙ Passaggi</button></div>${s.reads!=null||s.reps!=null?'<small>✎ passaggi personalizzati per questa sezione</small>':''}${bar(frac(s,b))}${open['s'+s.id]?`<div class=panel><div class=row><span style=flex:1>Letture (lettura + riletture)</span><input class=n type=number min=0 placeholder=${b.reads??S.set.reads} value="${s.reads??''}" data-c=sov data-f=reads ${ids}></div><div class=row><span style=flex:1>🗣 Ripetizioni orali (0 = nessuna)</span><input class=n type=number min=0 placeholder=${b.reps??(S.set.oral?S.set.reps:0)} value="${s.reps??''}" data-c=sov data-f=reps ${ids}></div><small>Campo vuoto = valore standard del libro o delle impostazioni (in grigio).</small> <button data-a=sreset ${ids}>Ripristina standard</button></div>`:''}<div class=chips>`;
 for(let i=0;i<T;i++){const st=dn(s,i)>=pg(s)?'ok':i==a?'now':'lock',o=i>=R;
  h+=`<button class="chip ${st} ${o?'oral':''}" ${st=='ok'?`data-a=undo data-i=${i} ${ids} title="Tocca per annullare"`:'disabled'}>${st=='ok'?'✓':o?'🗣':i+1} ${pl(i,R,P)}${o?' <em>facoltativa</em>':''}${st=='now'?' · '+Math.round(dn(s,i)/pg(s)*100)+'%':''}</button>`}
 h+='</div>';
 if(a>=0){const cur=s.p[a]??s.a-1;h+=`<div class=pb>${a>=R?'🗣 Ripetuto fino a':'Letto fino a'} pag. <input class=n type=number min=${s.a-1} max=${s.b} value="${cur<s.a?'':cur}" placeholder="${s.a-1}" data-c=pp data-i=${a} ${ids}> / ${s.b}<input type=range min=${s.a-1} max=${s.b} value=${cur} data-c=pp data-i=${a} ${ids}><button class=pri data-a=upto data-i=${a} data-v=${s.b} ${ids}>${a>=R?'✓ Fatta':'Tutta'}</button></div>`+(a>=R?'<small>Ripetizione orale facoltativa: puoi saltarla con ⚙ (0 ripetizioni).</small>':'')}
 else if(T)h+='<small>✓ Sezione completata</small>';
 return h+'</div>'}
const bookHTML=(e,b)=>{const o=open['b'+b.id],ids=`data-e=${e.id} data-b=${b.id}`,p=prog(b.secs.map(s=>[s,b]));
 return `<div class=sub><div class=row><button class="chev sm" data-a=tbook ${ids}>${o?'▲':'▼'}</button><div style="flex:1;min-width:0;cursor:pointer" data-a=tbook ${ids}><b>${b.type=='libro'?'📘':'📝'} ${esc(b.title)}</b><br><small>${b.author?esc(b.author)+' · ':''}p.${b.from}–${b.to}</small></div><b>${Math.round(p*100)}%</b></div>${bar(p)}`
 +(o?`<div class=row><button data-a=edit ${ids}>✏️ Modifica</button><button data-a=chap ${ids}>Capitoli</button><button data-a=delBook ${ids}>🗑</button></div><div class=row><small>Letture</small><input class=n type=number min=0 placeholder=${S.set.reads} value="${b.reads??''}" data-c=bk data-f=reads ${ids}><small>Orali (0 = nessuna)</small><input class=n type=number min=0 placeholder=${S.set.oral?S.set.reps:0} value="${b.reps??''}" data-c=bk data-f=reps ${ids}></div>${b.secs.map(s=>secHTML(e,b,s)).join('')}`:'')+'</div>'};
const addBook=e=>`<div class=sub><b>Aggiungi libro o appunti</b><div class=row><input id=bt-${e.id} placeholder="Titolo"><select id=by-${e.id}><option value=libro>Libro<option value=appunti>Appunti</select></div>
<details><summary>Autore, editore, anno, ISBN (aiutano la ricerca dei capitoli)</summary><div class=row><input id=ba-${e.id} placeholder=Autore><input id=bp-${e.id} placeholder=Editore></div><div class=row><input id=bn-${e.id} placeholder="Anno"><input id=bi-${e.id} placeholder="ISBN"></div></details>
<div class=row><input class=n id=bf-${e.id} type=number placeholder="da pag." value=1><input class=n id=bz-${e.id} type=number placeholder="a pag."><button class=pri data-a=addBook data-e=${e.id}>Aggiungi</button></div></div>`;
function vEsami(){return `<h2>Esami</h2><div class=card><div class=row><input id=xn placeholder="Nome esame"><input id=xd type=date><button class=pri data-a=addExam>Aggiungi</button></div></div>`
 +S.exams.map(e=>{const o=open[e.id];return `<div class=card><div class=row><button class=chev data-a=toggle data-e=${e.id}>${o?'▲':'▼'}</button>${ring(prog(allSecs(e)))}<b data-a=toggle data-e=${e.id} style="flex:1;cursor:pointer">${esc(e.name)}</b><input type=date style="flex:0 0 auto" value=${e.date} data-c=exd data-e=${e.id}><button data-a=renExam data-e=${e.id}>✏️</button><button data-a=delExam data-e=${e.id}>🗑</button></div>${cpHTML(allSecs(e),e)}`+(o?dlPanel(e)+e.books.map(b=>bookHTML(e,b)).join('')+addBook(e):'')+'</div>'}).join('')}
function vSet(){const s=S.set,f=(k,l)=>`<div class=row><span style=flex:1>${l}</span><input class=n type=number min=0 value=${s[k]} data-c=set data-f=${k}></div>`;
 return `<h2>Impostazioni</h2><div class=card><small>Valori standard: puoi cambiarli per ogni libro e per ogni capitolo (⚙ Passaggi).</small>${f('reads','Letture per sezione (lettura + riletture)')}
 <div class=row><label style=flex:1><input type=checkbox ${s.oral?'checked':''} data-c=oral> 🗣 Ripetizione orale (facoltativa)</label><input class=n type=number min=1 value=${s.reps} data-c=set data-f=reps></div>
 ${f('gap','Giorni minimi tra due passaggi della stessa sezione dopo le letture')}${f('margin','Giorni di margine prima dell\'esame')}${f('block','Pagine per blocco (se i capitoli sono disattivati)')}
 <div class=row><span>Giorni di riposo:</span>${['Dom','Lun','Mar','Mer','Gio','Ven','Sab'].map((n,i)=>`<label><input type=checkbox ${s.rest.includes(i)?'checked':''} data-c=rest data-i=${i}> ${n}</label>`).join(' ')}</div></div>
 <div class=card>${coarse()?`<label><input type=checkbox ${localStorage.getItem('peua')?'checked':''} data-c=ua> Tieni sempre visibili le frecce Annulla/Ripeti</label>`:'<small>Tornare indietro: Ctrl+Z annulla, Ctrl+Y (o Ctrl+Maiusc+Z) ripete. Su Mac Cmd al posto di Ctrl.</small>'}</div><div class=card><div class=row><button data-a=exp>Esporta backup JSON</button><label>Importa: <input type=file accept=.json data-c=imp></label></div>
 <p><small>${FIREBASE_CONFIG?`Sincronizzato come ${esc(user?.email)}`:'Modalità solo locale: configura Firebase per sincronizzare.'}</small></p>${FIREBASE_CONFIG?'<button data-a=out>Esci</button>':''}</div>`}
function render(){const a=$('#app'),y=scrollY;
 if(FIREBASE_CONFIG&&!user){a.innerHTML=`<header>📚 Planner Esami</header><main><div class=card><h2 style="margin-top:0">Benvenuto 👋</h2><div class=hint>Se è la prima volta che sei qui, inserisci la tua mail e inventa una password; poi, schiaccia su <b>Registrati</b>.</div><div class=row><input id=em type=email placeholder=Email autocomplete=email></div><div class=row><input id=pw type=password placeholder="Password (almeno 6 caratteri)" autocomplete=current-password></div><div class=row><button class=pri data-a=login style="flex:1">Accedi</button><button data-a=reg style="flex:1">Registrati</button></div><div class=row><button class=link data-a=forgot>Password dimenticata?</button></div></div></main>`;return}
 a.innerHTML=`<header>📚 Planner Esami</header><main>${{oggi:vOggi,esami:vEsami,impostazioni:vSet}[tab]()}</main><nav>${[['oggi','🎯','Oggi'],['esami','📚','Esami'],['impostazioni','⚙️','Impostazioni']].map(([t,i,l])=>`<button data-a=tab data-t=${t} class="${tab==t?'on':''}"><b>${i}</b>${l}</button>`).join('')}</nav>${undoBar()}`;scrollTo(0,y)}

// ===== capitoli =====
function mk(list){const{from,to}=ch.b,l=list.filter(x=>x.a==null||(x.a>=from&&x.a<=to));
 return l.map((x,i)=>({t:x.t,a:x.a,b:l[i+1]&&l[i+1].a!=null&&x.a!=null?l[i+1].a-1:(i==l.length-1?to:null)}))}
function edlg(){const d=$('#dlg'),b=eb.b,sel=t=>b.type==t?'selected':'';
 d.innerHTML=`<h3>Modifica ${b.type=='libro'?'libro':'appunti'}</h3><div class=row><input id=et value="${esc(b.title)}" placeholder=Titolo><select id=ey><option value=libro ${sel('libro')}>Libro<option value=appunti ${sel('appunti')}>Appunti</select></div>
 <div class=row><input id=ea value="${esc(b.author)}" placeholder=Autore><input id=ep value="${esc(b.pub)}" placeholder=Editore></div><div class=row><input id=en value="${esc(b.year)}" placeholder=Anno><input id=ei value="${esc(b.isbn)}" placeholder=ISBN></div>
 <div class=row><span>Pagine da</span><input class=n id=ef type=number value=${b.from}><span>a</span><input class=n id=ez type=number value=${b.to}></div>
 <div class=row><button class=pri data-a=esave>Salva</button><button data-a=ecancel>Annulla</button></div>`;if(!d.open)d.showModal()}
function dlg(){const d=$('#dlg');if(eb)return edlg();if(!ch){d.close();return}
 d.innerHTML=`<h3>Capitoli: ${esc(ch.b.title)}</h3><small>Pagine ${ch.b.from}–${ch.b.to}. Scegli un metodo, controlla la tabella e conferma.</small>
 <div class=row><button data-a=search>🔎 Cerca online</button><button data-a=blocks>Blocchi da ${S.set.block} pag.</button><button data-a=single>Sezione unica</button></div>
 <textarea id=paste rows=3 placeholder="Oppure incolla l'indice, una riga per capitolo. Esempio: Introduzione ..... 12"></textarea><div class=row><button data-a=parse>Analizza indice</button></div>
 <p>${ch.msg||''}</p>${ch.cands?ch.cands.map((c,i)=>`<div class=row><span style=flex:1>${esc(c.l)} <small>${c.toc?'indice ✓':'senza indice'}</small></span><button ${c.toc?'':'disabled'} data-a=use data-i=${i}>Usa</button></div>`).join(''):''}
 <div class=tbl>${ch.rows.map((r,i)=>`<div class=row><input data-c=row data-i=${i} data-f=t value="${esc(r.t)}"><input class=n type=number placeholder=da data-c=row data-i=${i} data-f=a value="${r.a??''}"><input class=n type=number placeholder=a data-c=row data-i=${i} data-f=b value="${r.b??''}"><button data-a=delrow data-i=${i}>✕</button></div>`).join('')}</div>
 <div class=row><button data-a=addrow>+ Riga</button><button class=pri data-a=ok>Conferma e assegna</button><button data-a=cancel>Annulla</button></div>`;if(!d.open)d.showModal()}
async function search(){const b=ch.b;ch.msg='Cerco su Open Library…';ch.cands=null;dlg();
 try{const q=new URLSearchParams({limit:5,fields:'key,title,author_name,first_publish_year'});
  if(b.isbn)q.set('isbn',b.isbn);else{q.set('title',b.title);if(b.author)q.set('author',b.author);if(b.pub)q.set('publisher',b.pub)}
  const r=await(await fetch('https://openlibrary.org/search.json?'+q)).json();
  ch.cands=(await Promise.all((r.docs||[]).map(async w=>{try{const ed=await(await fetch(`https://openlibrary.org${w.key}/editions.json?limit=40`)).json(),L=(ed.entries||[]).filter(x=>x.table_of_contents?.length>2),
   e=L.find(x=>b.pub&&(x.publishers||[]).join(' ').toLowerCase().includes(b.pub.toLowerCase()))||L[0];
   return{l:`${w.title} — ${(w.author_name||[]).slice(0,2).join(', ')} (${w.first_publish_year||'?'}${e?.publishers?', '+e.publishers[0]:''})`,toc:e?e.table_of_contents.map(x=>({t:((x.label?x.label+' ':'')+(x.title||'')).trim(),a:parseInt(x.pagenum)||null})):null}}catch{return null}}))).filter(Boolean);
  ch.msg=ch.cands.length?'Scegli l\'edizione giusta. Le pagine possono riferirsi a un\'altra edizione: controlla la tabella prima di confermare.':'Nessun risultato: prova a incollare l\'indice.'}catch{ch.msg='Ricerca non riuscita (connessione?).'}dlg()}
const parseIdx=t=>t.split('\n').map(l=>l.match(/^\s*(.+?)[\s.·…_–-]*(\d{1,4})\s*$/)).filter(m=>m&&m[1].trim().length>1).map(m=>({t:m[1].trim(),a:+m[2]}));

// ===== azioni =====
const setP=(d,v)=>{const{b,s}=F(d);touch(s,b);s.p[+d.i]=Math.min(s.b,Math.max(s.a-1,v));s.last=today();save()};
const H={
 tab:d=>{tab=d.t;scrollTo(0,0);render()},toggle:d=>{open[d.e]=!open[d.e];render()},
 addExam:()=>{const n=$('#xn').value.trim(),dt=$('#xd').value;if(!n||!dt)return alert('Inserisci nome e data.');S.exams.push({id:uid(),name:n,date:dt,books:[]});save()},
 delExam:d=>{if(confirm('Eliminare l\'esame?')){S.exams=S.exams.filter(e=>e.id!=d.e);save()}},
 addBook:d=>{const{e}=F(d),g=k=>$(`#${k}-${d.e}`).value.trim(),t=g('bt'),f=+g('bf'),z=+g('bz');
  if(!t||!f||!z||z<f)return alert('Inserisci titolo e pagine valide.');
  const b={id:uid(),title:t,type:g('by'),author:g('ba'),pub:g('bp'),year:g('bn'),isbn:g('bi').replace(/[^0-9Xx]/g,''),from:f,to:z,reads:null,reps:null,secs:[{id:uid(),t,a:f,b:z,p:[],last:''}]};
  e.books.push(b);save();if(b.type=='libro')H.chap({e:e.id,b:b.id})},
 delBook:d=>{const{e}=F(d);if(confirm('Eliminare?')){e.books=e.books.filter(b=>b.id!=d.b);save()}},
 upto:d=>setP(d,+d.v),undo:d=>{const{s}=F(d);s.p.length=Math.min(s.p.length,+d.i);save()},
 sopt:d=>{const k='s'+d.s;open[k]=!open[k];render()},sreset:d=>{const{s}=F(d);s.reads=s.reps=null;save()},
 chap:d=>{const{e,b}=F(d);ch={e,b,rows:b.secs.map(s=>({t:s.t,a:s.a,b:s.b})),msg:'',cands:null};dlg()},
 search,use:d=>{const c=ch.cands[+d.i];ch.rows=mk(c.toc);ch.msg='Indice caricato: controlla titoli e pagine.'+(c.toc.some(x=>!x.a)?' ⚠ Mancano alcune pagine: completale o incolla l\'indice.':'');dlg()},
 blocks:()=>{const{from,to}=ch.b,N=Math.max(1,S.set.block);ch.rows=[];for(let a=from;a<=to;a+=N)ch.rows.push({t:`Pag. ${a}–${Math.min(a+N-1,to)}`,a,b:Math.min(a+N-1,to)});ch.msg='Blocchi generati.';dlg()},
 single:()=>{ch.rows=[{t:ch.b.title,a:ch.b.from,b:ch.b.to}];ch.msg='Una sola sezione.';dlg()},
 parse:()=>{const l=parseIdx($('#paste').value);if(!l.length){ch.msg='Non ho riconosciuto righe "titolo + pagina".';return dlg()}ch.rows=mk(l);ch.msg='Indice analizzato: controlla e conferma.';dlg()},
 delrow:d=>{ch.rows.splice(+d.i,1);dlg()},addrow:()=>{ch.rows.push({t:'',a:null,b:null});dlg()},cancel:()=>{ch=null;dlg()},
 ok:()=>{const r=ch.rows;if(!r.length||r.some(x=>!x.t||!x.a||!x.b||x.b<x.a||x.a<ch.b.from||x.b>ch.b.to))return alert('Ogni riga ha bisogno di titolo e pagine valide, comprese tra '+ch.b.from+' e '+ch.b.to+'.');
  const old=ch.b.secs;if(old.some(s=>s.p.length)&&!confirm('I progressi si mantengono solo per le sezioni con le stesse pagine. Continuare?'))return;
  ch.b.secs=r.map(x=>{const o=old.find(s=>s.a==x.a&&s.b==x.b);return o?{...o,t:x.t}:{id:uid(),t:x.t,a:x.a,b:x.b,p:[],last:''}});ch=null;dlg();save()},
 mode:d=>{const{e}=F(d);e.mode=d.v;save()},tbook:d=>{const k='b'+d.b;open[k]=!open[k];render()},uundo:()=>histUndo(),uredo:()=>histRedo(),uhide:()=>{hide=true;render()},
 forgot:()=>{const m=$('#em').value.trim();if(!m)return alert('Scrivi la tua email nel campo Email, poi tocca di nuovo "Password dimenticata?".');api.reset(m).then(()=>alert('Se l\'indirizzo è registrato, riceverai un\'email con il link per scegliere una nuova password. Controlla anche lo spam.')).catch(e=>alert(errIt(e)))},
 renExam:d=>{const{e}=F(d),n=prompt('Nome esame',e.name);if(n?.trim()){e.name=n.trim();save()}},
 edit:d=>{const{e,b}=F(d);eb={e,b};dlg()},ecancel:()=>{eb=null;dlg()},
 esave:()=>{const g=k=>$('#'+k).value.trim(),t=g('et'),f=+g('ef'),z=+g('ez');if(!t||!f||!z||z<f)return alert('Inserisci titolo e pagine valide.');
  const{e,b}=eb,ot=b.title,of=b.from,oz=b.to;Object.assign(b,{title:t,type:g('ey'),author:g('ea'),pub:g('ep'),year:g('en'),isbn:g('ei').replace(/[^0-9Xx]/g,'')});
  if(f!=of||z!=oz){b.from=f;b.to=z;if(b.secs.length==1){const s=b.secs[0],ob=s.b;s.p=s.p.map(v=>v>=ob?z:Math.min(v,z));s.a=f;s.b=z}
   else{eb=null;save();H.chap({e:e.id,b:b.id});ch.msg='Hai cambiato le pagine del libro: adegua i capitoli alle nuove pagine, poi conferma.';return dlg()}}
  if(b.secs.length==1&&b.secs[0].t==ot)b.secs[0].t=t;eb=null;dlg();save()},
 exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='planner-backup.json';a.click()},
 login:()=>api.login($('#em').value.trim(),$('#pw').value).catch(e=>alert(errIt(e))),reg:()=>api.reg($('#em').value.trim(),$('#pw').value).catch(e=>alert(errIt(e))),out:()=>api.out()};
const C={
 sov:(d,v)=>{const{s}=F(d);s[d.f]=v===''?null:Math.max(0,+v);save()},pp:(d,v)=>setP(d,v===''?-1e9:+v),bk:(d,v)=>{const{b}=F(d);b[d.f]=v===''?null:Math.max(0,+v);save()},set:(d,v)=>{S.set[d.f]=Math.max(0,+v);save()},
 dl:(d,v)=>{const{e}=F(d),nd={...(e.dl||{})};if(v)nd[d.k]=v;else delete nd[d.k];
  const ds=cps(allSecs(e)).map(x=>nd[x.key]).filter(Boolean);
  if(ds.some(x=>x>e.date)){alert('La scadenza non può essere dopo la data dell\'esame ('+e.date+').');return render()}
  if(ds.some((x,i)=>i&&x<ds[i-1])){alert('Le scadenze devono seguire l\'ordine dei traguardi: un traguardo successivo non può avere una data precedente.');return render()}
  e.dl=nd;save()},
 ua:(d,v,el)=>{localStorage.setItem('peua',el.checked?'1':'');render()},oral:(d,v,el)=>{S.set.oral=el.checked;save()},rest:(d,v,el)=>{const r=S.set.rest,i=+d.i;S.set.rest=el.checked?[...r,i]:r.filter(x=>x!=i);save()},
 exd:(d,v)=>{F(d).e.date=v;save()},row:(d,v)=>{ch.rows[+d.i][d.f]=d.f=='t'?v:(v===''?null:+v)},
 imp:(d,v,el)=>{const f=el.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);init();save()}catch{alert('File non valido.')}})}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)H[el.dataset.a]?.(el.dataset)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)C[el.dataset.c]?.(el.dataset,el.value,el)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.c=='pp'){const p=el.closest('.pb');p.querySelectorAll('input').forEach(x=>{if(x!==el)x.value=el.value})}});

// ===== sincronizzazione Firebase =====
async function cloud(){if(!FIREBASE_CONFIG)return;const V='https://www.gstatic.com/firebasejs/10.12.2/';
 const[A,Au,Fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
 const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app),db=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({tabManager:Fs.persistentMultipleTabManager()})});
 api={login:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),reg:(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p),out:()=>Au.signOut(auth),reset:e=>Au.sendPasswordResetEmail(auth,e)};
 Au.onAuthStateChanged(auth,u=>{user=u;unsub?.();if(!u)return render();const ref=Fs.doc(db,'users',u.uid);
  api.push=s=>Fs.setDoc(ref,{json:JSON.stringify(s),ts:Date.now()});
  unsub=Fs.onSnapshot(ref,sn=>{if(sn.metadata.hasPendingWrites)return;
   if(sn.exists()){S=JSON.parse(sn.data().json);init();cur=JSON.stringify(S);hist=[];fut=[];localStorage.setItem('pe',cur);if(S.exams.some(e=>e.books.some(b=>b.secs.some(s=>s.n!==undefined))))api.push(S)}else api.push(S);render()})})}
render();cloud();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
